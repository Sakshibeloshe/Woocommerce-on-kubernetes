# Serves the built React app. /api and /mcp never reach this container:
# the Ingress sends them straight to the gateway.
server {
    listen 8080;                       # unprivileged port: the container runs as non-root
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers. CSP: only our own scripts/styles/API may load.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed build files never change: cache them for a year.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Single-page app: unknown paths (/servers, /chat, /invite...) get index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
