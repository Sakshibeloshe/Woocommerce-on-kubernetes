# The gateway backend: REST API for the dashboard + the single MCP endpoint.
---
# Upstream servers registered on FIRST start (WooCommerce first, as the user story asks).
# Credential values are not here: "valueFromEnv" names an env var filled from a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-seed
  namespace: gateway
data:
  servers.json: |
    [
      { "slug": "woo",     "name": "WooCommerce", "url": "http://mcp-woocommerce.store.svc/mcp" },
      { "slug": "notes",   "name": "Team Notes",  "url": "http://mcp-notes.mcp-servers.svc/mcp",
        "credential": { "type": "bearer", "valueFromEnv": "SEED_NOTES_TOKEN" } },
      { "slug": "toolbox", "name": "Toolbox",     "url": "http://mcp-toolbox.mcp-servers.svc/mcp" }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels:
        app: gateway                # the NetworkPolicies of the upstream namespaces allow exactly this label
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gateway
          image: mcp-gateway:0.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: http://dashboard.localtest.me
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: gateway
            - name: PGUSER
              value: gateway
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: gateway-db, key: password } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: session-secret } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: encryption-key } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: admin-email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: admin-password } }
            - name: SEED_SERVERS_FILE
              value: /config/servers.json
            - name: SEED_NOTES_TOKEN
              valueFrom: { secretKeyRef: { name: gateway-upstream-credentials, key: notes-token } }
            - name: UPSTREAM_REFRESH_INTERVAL_MS
              value: "10000"
            # Chat agent: Ollama on the host PC (Docker Desktop forwards host.docker.internal).
            - name: LLM_BASE_URL
              value: http://host.docker.internal:11434/v1
            - name: LLM_MODEL
              value: qwen3:8b
            - name: LLM_REASONING_EFFORT   # "none" = skip qwen3's thinking: ~4x faster on a laptop
              value: "none"
            - name: LLM_TIMEOUT_MS         # a local model on a laptop GPU is slow; cloud APIs need far less
              value: "300000"
            - name: LLM_API_KEY          # empty for Ollama; a cloud provider's key lives in this Secret
              valueFrom: { secretKeyRef: { name: gateway-llm, key: api-key, optional: true } }
          volumeMounts:
            - name: seed
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m,  memory: 96Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }    # includes the database check
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }   # process only: a DB outage shouldn't restart us
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: seed
          configMap:
            name: gateway-seed
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: gateway
spec:
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 8080
---
# Public: one host for everything. Longest path wins: /mcp and /api go to the gateway,
# everything else to the dashboard's static files.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: gateway
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.localtest.me
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 80 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard, port: { number: 80 } } }
