# Every pod in this namespace (podSelector: {}) accepts connections only from
# gateway pods. Same rule as for mcp-woocommerce in the store namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-from-gateway-only
  namespace: mcp-servers
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gateway }
          podSelector:
            matchLabels: { app: gateway }
      ports:
        - port: 3000
          protocol: TCP
