# Toolbox MCP server: stateless, no credential.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-toolbox
  namespace: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-toolbox }
  template:
    metadata:
      labels: { app: mcp-toolbox }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp
          image: mcp-toolbox:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 25m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-toolbox
  namespace: mcp-servers
spec:
  selector: { app: mcp-toolbox }
  ports:
    - port: 80
      targetPort: 3000
