# The WooCommerce MCP server, inside the cluster.
# Deliberately NO Ingress: it has no public address. Only in-cluster callers can
# even try to reach it, and the NetworkPolicy (60-network-policies.yaml) narrows
# that down to the gateway.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-woocommerce
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-woocommerce }
  template:
    metadata:
      labels: { app: mcp-woocommerce }
    spec:
      securityContext:
        runAsNonRoot: true              # refuse to start if the image would run as root
        runAsUser: 1000                 # the "node" user from the Dockerfile
      containers:
        - name: mcp
          image: mcp-woocommerce:0.1.1  # loaded with: k3d image import mcp-woocommerce:0.1.1 -c woo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Same code as on your laptop; only the environment differs.
            - name: WC_BASE_URL
              value: http://wordpress.store.svc   # the WordPress Service, not the public URL
            - name: STORE_TIMEZONE
              valueFrom: { configMapKeyRef: { name: store-config, key: STORE_TIMEZONE } }
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: woocommerce-api, key: consumer-key } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: woocommerce-api, key: consumer-secret } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # the server never writes to disk
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 25m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 20
---
# Stable in-cluster address: http://mcp-woocommerce.store.svc/mcp
apiVersion: v1
kind: Service
metadata:
  name: mcp-woocommerce
  namespace: store
spec:
  type: ClusterIP                       # internal only (the default)
  selector: { app: mcp-woocommerce }
  ports:
    - port: 80
      targetPort: 3000
