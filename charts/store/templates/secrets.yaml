{{- $ns := .Release.Namespace -}}
{{- if .Values.secrets.generate }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ include "platform.secretValue" (dict "root" $ "ns" $ns "name" "mysql-credentials" "key" "root-password") | quote }}
  password: {{ include "platform.secretValue" (dict "root" $ "ns" $ns "name" "mysql-credentials" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.store.adminUser | quote }}
  email: {{ .Values.store.adminEmail | quote }}
  password: {{ include "platform.secretValue" (dict "root" $ "ns" $ns "name" "wordpress-admin" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-api
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  consumer-key: {{ include "platform.secretValue" (dict "root" $ "ns" $ns "name" "woocommerce-api" "key" "consumer-key" "gen" "ck") | quote }}
  consumer-secret: {{ include "platform.secretValue" (dict "root" $ "ns" $ns "name" "woocommerce-api" "key" "consumer-secret" "gen" "cs") | quote }}
{{- end }}
