{{- /*
  Every Secret the platform needs. With secrets.generate=true they are created here with
  random values that survive upgrades (see platform.secretValue). With false, they must
  already exist (k8s/create-secrets.sh creates exactly these names and keys).
  "helm.sh/resource-policy: keep": an uninstall must not delete the database passwords,
  or a reinstall could no longer open the existing volumes.
*/ -}}
{{- if .Values.secrets.generate }}
{{- $s := .Values.namespaces.store -}}
{{- $m := .Values.namespaces.mcpServers -}}
{{- $g := .Values.namespaces.gateway -}}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ $s }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  root-password: {{ include "platform.secretValue" (dict "root" $ "ns" $s "name" "mysql-credentials" "key" "root-password") | quote }}
  password: {{ include "platform.secretValue" (dict "root" $ "ns" $s "name" "mysql-credentials" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  namespace: {{ $s }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  username: {{ .Values.store.adminUser | quote }}
  email: {{ .Values.store.adminEmail | quote }}
  password: {{ include "platform.secretValue" (dict "root" $ "ns" $s "name" "wordpress-admin" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-api
  namespace: {{ $s }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  consumer-key: {{ include "platform.secretValue" (dict "root" $ "ns" $s "name" "woocommerce-api" "key" "consumer-key" "gen" "ck") | quote }}
  consumer-secret: {{ include "platform.secretValue" (dict "root" $ "ns" $s "name" "woocommerce-api" "key" "consumer-secret" "gen" "cs") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: notes-auth
  namespace: {{ $m }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  token: {{ include "platform.secretValue" (dict "root" $ "ns" $m "name" "notes-auth" "key" "token") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db
  namespace: {{ $g }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  password: {{ include "platform.secretValue" (dict "root" $ "ns" $g "name" "gateway-db" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: {{ $g }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  session-secret: {{ include "platform.secretValue" (dict "root" $ "ns" $g "name" "gateway-secrets" "key" "session-secret") | quote }}
  encryption-key: {{ include "platform.secretValue" (dict "root" $ "ns" $g "name" "gateway-secrets" "key" "encryption-key" "gen" "bytes32") | quote }}
  admin-email: {{ .Values.gateway.adminEmail | quote }}
  admin-password: {{ include "platform.secretValue" (dict "root" $ "ns" $g "name" "gateway-secrets" "key" "admin-password") | quote }}
---
# The gateway's copy of the notes token (a pod can only read Secrets in its own
# namespace). Same cached value as notes-auth above.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-upstream-credentials
  namespace: {{ $g }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  notes-token: {{ include "platform.secretValue" (dict "root" $ "ns" $m "name" "notes-auth" "key" "token") | quote }}
{{- end }}
