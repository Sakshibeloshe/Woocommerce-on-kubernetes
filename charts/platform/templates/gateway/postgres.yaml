{{- $ns := .Values.namespaces.gateway -}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      {{- include "platform.podDefaults" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                   # the image's "postgres" user
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.gateway.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: gateway }
            - { name: POSTGRES_USER, value: gateway }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-db, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources: {{- toYaml .Values.gateway.postgres.resources | nindent 12 }}
          startupProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"] }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"] }
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "platform.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.gateway.postgres.storage }}
