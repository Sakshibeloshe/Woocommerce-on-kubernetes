{{- /*
  Store setup as a Helm HOOK.
  Ordering: "post-install,post-upgrade" = Helm first creates/updates every normal
  resource (Secrets, ConfigMaps incl. the scripts, MySQL, WordPress), THEN runs this Job
  and waits for it (bounded by "helm --timeout"). The script itself waits until
  WordPress' files exist and MySQL accepts connections, so it doesn't depend on pod
  readiness timing. "before-hook-creation" deletes the previous Job right before a new
  one is created, so the last run's logs stay readable until the next upgrade.
  The script is idempotent, which is what makes running it on EVERY upgrade safe.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: store-setup
  namespace: {{ .Values.namespaces.store }}
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: { app: store-setup }
      annotations:
        # Changing a script changes this checksum, which makes the change visible in diffs.
        checksum/scripts: {{ (.Files.Glob "files/store-setup/*").AsConfig | sha256sum }}
    spec:
      restartPolicy: OnFailure
      {{- include "platform.podDefaults" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 33                   # owner of the WordPress files (www-data in the wordpress image)
        runAsGroup: 33
      affinity:
        podAffinity:                    # same node as WordPress: the volume is ReadWriteOnce
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: wordpress } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: wp-cli
          image: {{ .Values.store.setup.image }}
          command: ["sh", "/scripts/setup.sh"]
          envFrom:
            - configMapRef: { name: store-config }
          env:
            - { name: WORDPRESS_DB_HOST, value: mysql }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: password } }
            - name: WP_ADMIN_USER
              valueFrom: { secretKeyRef: { name: wordpress-admin, key: username } }
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: wordpress-admin, key: password } }
            - name: WP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: wordpress-admin, key: email } }
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: woocommerce-api, key: consumer-key } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: woocommerce-api, key: consumer-secret } }
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: wordpress, mountPath: /var/www/html }
            - { name: scripts, mountPath: /scripts }
          resources: {{- toYaml .Values.store.setup.resources | nindent 12 }}
      volumes:
        - name: wordpress
          persistentVolumeClaim: { claimName: wordpress-data }
        - name: scripts
          configMap: { name: store-setup-scripts }
