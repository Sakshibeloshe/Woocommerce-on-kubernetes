{{- $ns := .Values.namespaces.store -}}
# No Ingress on purpose: reachable only inside the cluster, and the NetworkPolicy
# narrows that to the gateway pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-woocommerce
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-woocommerce }
  template:
    metadata:
      labels: { app: mcp-woocommerce }
    spec:
      {{- include "platform.podDefaults" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp
          image: {{ include "platform.image" (list .Values.mcp.woocommerce.image $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: WC_BASE_URL
              value: http://wordpress.{{ $ns }}.svc
            - name: STORE_TIMEZONE
              valueFrom: { configMapKeyRef: { name: store-config, key: STORE_TIMEZONE } }
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: woocommerce-api, key: consumer-key } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: woocommerce-api, key: consumer-secret } }
          {{- include "platform.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.mcp.woocommerce.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-woocommerce
  namespace: {{ $ns }}
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: mcp-woocommerce }
  ports:
    - { port: 80, targetPort: 3000 }
